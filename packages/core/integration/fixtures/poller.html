<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Background poller — Fixture</title>
  </head>
  <body>
    <!-- A page with a persistent background heartbeat (polls every 200ms). The
         event-driven settle must NOT hang waiting for this ambient traffic to
         stop — it should resolve in the gaps between polls. -->
    <main>
      <h1>Live dashboard</h1>
      <button id="refresh">Refresh</button>
      <div id="status">idle</div>
    </main>
    <script>
      // ambient heartbeat — never stops
      setInterval(() => {
        fetch("/api/heartbeat").catch(() => {});
      }, 200);
      document.getElementById("refresh").addEventListener("click", () => {
        document.getElementById("status").textContent = "refreshed";
      });
    </script>
  </body>
</html>
