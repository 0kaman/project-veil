<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in — Fixture</title>
  </head>
  <body>
    <!-- Server-rendered form: behavior lives in action/method + href, no JS.
         Exercises Stage 1 structural-event synthesis and the auth semantic rule. -->
    <main>
      <h1>Sign in</h1>
      <form action="/session" method="post">
        <label>Email <input type="text" name="email" aria-label="Email address" /></label>
        <label>Password <input type="password" name="password" aria-label="Password" /></label>
        <button type="submit">Sign in</button>
      </form>
      <a href="/password_reset">Forgot password?</a>
      <a href="#top">Back to top</a>
      <a href="/signup">Create an account</a>
    </main>
  </body>
</html>
