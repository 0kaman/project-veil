<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dynamic list — Fixture</title>
  </head>
  <body>
    <!-- Content mutates AFTER load and on interaction: exercises the mutation
         watcher + incremental graph updates. -->
    <main>
      <h1>Tasks</h1>
      <ul id="list">
        <li><button class="task">Task A</button></li>
      </ul>
      <button id="add-task">Add task</button>
    </main>
    <script>
      let n = 1;
      function addTask() {
        n++;
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = "task";
        b.textContent = "Task " + String.fromCharCode(64 + n);
        li.appendChild(b);
        document.getElementById("list").appendChild(li);
      }
      document.getElementById("add-task").addEventListener("click", addTask);
    </script>
  </body>
</html>
