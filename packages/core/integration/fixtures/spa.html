<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SPA — Fixture</title>
  </head>
  <body>
    <!-- Single-page app: clicking a nav item does history.pushState (no full
         load) and fetches JSON. Exercises the interact() pushState-no-stall fix
         and network correlation. -->
    <nav aria-label="Primary">
      <button id="go-products">Products</button>
      <button id="go-account">Account</button>
    </nav>
    <main id="view">Home</main>
    <script>
      async function route(path, label) {
        history.pushState({}, "", path);
        // A real fetch so Stage 3 has a request to correlate.
        try {
          await fetch("/api/data" + path, { headers: { accept: "application/json" } });
        } catch {}
        document.getElementById("view").textContent = label;
      }
      document.getElementById("go-products").addEventListener("click", () =>
        route("/products", "Products view"),
      );
      document.getElementById("go-account").addEventListener("click", () =>
        route("/account", "Account view"),
      );
    </script>
  </body>
</html>
