<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wireless Headphones — Shop</title>
  </head>
  <body>
    <nav aria-label="Primary">
      <a href="/">Home</a>
      <a href="/deals">Deals</a>
      <form role="search" action="/search" method="get">
        <input type="search" name="q" aria-label="Search products" />
        <button type="submit">Search</button>
      </form>
    </nav>

    <main>
      <h1>Wireless Headphones</h1>
      <p>$129.99</p>
      <label>Quantity
        <select id="qty" aria-label="Quantity">
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </label>
      <!-- Two API-triggering buttons: correlation must map each to its own call -->
      <button id="add-to-cart">Add to cart</button>
      <button id="add-to-wishlist">Add to wishlist</button>
      <button id="buy-now">Buy now</button>
    </main>

    <script>
      const api = (path, body) =>
        fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      document.getElementById("add-to-cart").addEventListener("click", () => api("/api/cart", { sku: "wh-1", qty: 1 }));
      document.getElementById("add-to-wishlist").addEventListener("click", () => api("/api/wishlist", { sku: "wh-1" }));
      document.getElementById("buy-now").addEventListener("click", () => api("/api/checkout", { sku: "wh-1" }));
    </script>
  </body>
</html>
